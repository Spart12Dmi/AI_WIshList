[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: launches Chromium against a local test server", "live: real network and local Ollama quality evaluation (opt in)"]
addopts = "-m 'not browser and not live'"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
